html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:64px clamp(220px,19vw,290px) minmax(0,1fr) clamp(220px,19vw,290px) 64px;grid-template-rows:50px minmax(0,1fr) clamp(270px,42vh,350px);grid-template-areas:"lr lp top rp rr" "lr lp center rp rr" "lr lp tl rp rr"}
#lr{grid-area:lr}#lp{grid-area:lp}#rp{grid-area:rp}#rr{grid-area:rr}
button{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--p2))}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.pri:hover{filter:brightness(1.1)}

input[type=color]{padding:0;width:30px;height:26px;cursor:pointer}input[type=range]{width:100%;accent-color:var(--ac);padding:0}
.rail{background:var(--p1);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow-y:auto;border-right:1px solid var(--bd)}#rr{border-right:0;border-left:1px solid var(--bd)}

.rb:hover{color:var(--tx);border:0}.rb.on{background:var(--p2);color:var(--ac)}
.side{background:var(--p1);display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid var(--bd)}.side.r{border-right:0;border-left:1px solid var(--bd)}
.ph{display:flex;align-items:center;gap:8px;padding:14px 14px 6px;font-size:15px}.badge{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:0 6px;font-size:11px;color:var(--mu)}
.lbody,.pbody{flex:1;overflow:auto;padding:6px 14px 14px}
.srch{width:100%;padding:8px 10px;margin:4px 0 6px;border-radius:9px}
.sec{display:flex;justify-content:space-between;margin:14px 0 6px;font-size:12px;cursor:pointer}.sec b{font-weight:600}.sec span{color:var(--mu)}
.wide{width:100%;padding:9px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.emo{grid-template-columns:repeat(6,1fr)}.emo button{font-size:19px;padding:3px;display:flex;align-items:center;justify-content:center;color:var(--ac)}.list{display:flex;flex-direction:column;gap:2px}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:9px;overflow:hidden;cursor:pointer;font-size:11px}.card:hover{border-color:var(--ac)}.card.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.card .th{height:70px;background:#222 center/cover;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;position:relative}.card .n{padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;border-radius:4px;padding:0 5px;font-size:10px}
.tile{background:#111;color:#fff}.tile .n{white-space:normal;text-align:center;padding:14px 6px}
.rcard{border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}

.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--p1);border-bottom:1px solid var(--bd);white-space:nowrap;position:relative;z-index:20}

.center{grid-area:center;min-height:0;min-width:0;display:flex}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:46px 14px 12px;background:var(--bg)}
#cv{max-width:100%;max-height:100%;box-shadow:0 8px 30px #0004;background:#000;touch-action:none}
.qa{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:var(--p1);border:1px solid var(--bd);border-radius:10px;padding:3px;max-width:96%;overflow-x:auto;z-index:5}.qa button{padding:3px 7px;border:0;background:none}.qa button:hover{background:var(--p2)}
.fsb{position:absolute;right:12px;bottom:10px;padding:2px 8px}
.tlp{grid-area:tl;background:var(--p1);display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--bd)}
.tlbar{display:flex;gap:6px;align-items:center;padding:6px 12px;overflow-x:auto;white-space:nowrap}.tlbar .t{font-variant-numeric:tabular-nums;color:var(--mu);min-width:128px}
.play{border-radius:50%;width:34px;height:34px;background:var(--tx);color:var(--bg);border:0;padding:0}
.tls{flex:1;overflow:auto;position:relative}#tlin{position:relative;min-height:100%}
.ruler{height:24px;position:sticky;top:0;z-index:5;background:var(--p2);border-bottom:1px solid var(--bd);cursor:pointer}.ruler b{position:absolute;top:5px;font:10px system-ui;color:var(--mu);border-left:1px solid var(--bd);padding-left:3px;height:18px;font-weight:400}
.bm{position:absolute;top:13px;width:8px;height:8px;background:var(--ac2);margin-left:-4px;transform:rotate(45deg);pointer-events:none}
.trow{display:flex;height:40px;border-bottom:1px solid var(--bd)}.tlab{position:sticky;left:0;z-index:4;width:100px;flex:none;background:var(--p1);color:var(--mu);font-size:11px;padding:4px 10px;border-right:1px solid var(--bd)}.lane{position:relative;flex:1}
.clip{position:absolute;top:3px;height:34px;border-radius:7px;overflow:hidden;color:#fff;font-size:11px;background:#6a4bd8 left center/auto 100% repeat-x;border:2px solid transparent;cursor:grab;user-select:none;touch-action:none}
.clip.video{background-color:#6a4bd8}.clip.image{background-color:#14a89a}.clip.text{background-color:#e08a1e}.clip.sticker{background-color:#d6438a}.clip.audio{background-color:#2f9e5b}.clip.shape{background-color:#2d8cff}.clip.\33d{background-color:#8a4bff}.clip.fx{background-color:#0ea5c6}
.clip.sel{border-color:var(--ac);box-shadow:0 0 0 2px #fff8 inset,0 0 0 1px var(--ac)}
.clip .lb{position:absolute;left:8px;top:2px;right:8px;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #000;pointer-events:none}.clip .h{position:absolute;top:0;bottom:0;width:8px;background:#fff7;cursor:ew-resize}.h.l{left:0}.h.r{right:0}
.wv{position:absolute;inset:14px 0 0;width:100%;height:24px;color:#d7ffe6;pointer-events:none}.km{position:absolute;bottom:2px;width:7px;height:7px;background:#ffd34a;transform:rotate(45deg);pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);z-index:6;pointer-events:none}#ph:before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--tx)}
.row{display:grid;grid-template-columns:66px 1fr 40px 22px;gap:6px;align-items:center;margin:6px 0}.row label{color:var(--mu);font-size:11px}.row output{font-size:11px;text-align:right}
.kf{padding:0;border:0;background:none;color:var(--mu)}.kf.on{color:var(--ac2)}
h4{margin:16px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}h4:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}.chips button{padding:3px 9px;font-size:12px}
.f2{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}.f2>label{color:var(--mu);font-size:11px;min-width:66px}
.empty{border:1px dashed var(--bd);border-radius:10px;padding:14px;color:var(--mu);margin-top:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1a2bee;color:#fff;padding:8px 14px;border-radius:20px;z-index:99;display:none}

.empty2{position:absolute;inset:46px 14px 12px;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center}.empty2 .box{pointer-events:auto;background:var(--p1);border:1px solid var(--bd);border-radius:16px;padding:20px 24px;box-shadow:0 12px 40px #0002;max-width:360px}.empty2 h3{margin:0 0 4px}
.tlbar button{flex:none}.play{flex:none}#size{max-width:170px}.top .sp{min-width:0}

<script>

/* ---------- export & Hivepostly Composer direct bridge ---------- */
let rec,chunks;
function savePendingPostToIndexedDB(blob, mediaType, name, caption) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('HivepostlyStudioDB', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('pending_posts')) {
          db.createObjectStore('pending_posts', { keyPath: 'id' });
        }
      };
      req.onsuccess = e => {
        const db = e.target.result;
        const tx = db.transaction('pending_posts', 'readwrite');
        const store = tx.objectStore('pending_posts');
        const record = {
          id: 'latest_post',
          mediaBlob: blob,
          mediaType: mediaType,
          name: name,
          caption: caption,
          timestamp: Date.now()
        };
        store.put(record);
        tx.oncomplete = () => { db.close(); resolve(record); };
        tx.onerror = () => { db.close(); resolve(null); };
      };
      req.onerror = () => resolve(null);
    } catch (err) {
      resolve(null);
    }
  });
}

async function dispatchToHivepostlyComposer(blob, mediaType, fileName, customCaption) {
  const title = $('#ptitle').value || 'Hivepostly_Studio_Edit';
  const name = fileName || (title + '.' + (mediaType === 'image' ? 'png' : 'webm'));
  const caption = customCaption || `${title} 🔥 Created in Hivepostly Studio ready to post across 8 networks! #hivepostly #viral #creator`;

  // 1. Save to persistent IndexedDB
  await savePendingPostToIndexedDB(blob, mediaType, name, caption);

  // 2. Cross-tab broadcasts
  const payload = {
    type: 'HIVEPOSTLY_IMPORT_MEDIA',
    media: {
      url: URL.createObjectURL(blob),
      type: mediaType,
      name: name
    },
    caption: caption,
    timestamp: Date.now()
  };

  const mainComposerUrl = new URL('./?tab=composer&from=editor', window.location.href).href;

  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage(payload, '*');
      window.opener.location.href = mainComposerUrl;
      window.opener.focus();
    } catch (e) {
      console.warn('opener error:', e);
    }
  }

  try {
    const bc = new BroadcastChannel('hivepostly_channel');
    bc.postMessage(payload);
    setTimeout(() => bc.close(), 1000);
  } catch (e) {}

  try {
    localStorage.setItem('hivepostly_pending_post', JSON.stringify(payload));
  } catch (e) {}

  toast('🚀 Video Connected! Opening Main Website Composer...', 2000);

  // 3. Automatically navigate to the main website composer
  setTimeout(() => {
    window.location.href = mainComposerUrl;
  }, 450);
}
